{{- /* Markdown links: external links open in a new tab, as on the old site. */ -}}
{{- $u := urls.Parse .Destination -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- if in (slice "http" "https") $u.Scheme }} target="_blank" rel="noopener"{{ end }}>{{ .Text }}</a>
{{- /* chomp trailing newline */ -}}
