{{ define "main" }}
{{ .Content }}
{{ range hugo.Data.links }}
<h2>{{ .section }}</h2>
<section class="cards">
  {{ range .links }}
  {{- $link := . }}
  <a class="card" href="{{ .url }}" target="_blank" rel="noopener">
    {{- with resources.Get (printf "images/%s" .image) | fingerprint }}
    <img {{ if $link.padded }}class="padded" {{ end }}src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="" loading="lazy" />
    {{- end }}
    <div>
      <h3>{{ .name }}</h3>
      <p>{{ .description }}</p>
    </div>
  </a>
  {{ end }}
</section>
{{ end }}
{{ end }}
